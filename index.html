<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mini Instagram</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #000000;
      color: #ffffff;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    /* Hide scrollbars for native app feel */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Instagram Gradient Ring */
    .ig-gradient-ring {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      padding: 2.5px;
      border-radius: 9999px;
    }
    .ig-gradient-btn {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }
    /* Double-tap Heart Pop Animation */
    @keyframes heartPop {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
      }
      25% {
        transform: translate(-50%, -50%) scale(1.25);
        opacity: 1;
      }
      50% {
        transform: translate(-50%, -50%) scale(0.95);
        opacity: 1;
      }
      80% {
        transform: translate(-50%, -50%) scale(1.05);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.3);
        opacity: 0;
      }
    }
    .animate-heart-pop {
      animation: heartPop 0.85s ease-out forwards;
    }
    /* Reels Vertical Snap Scrolling */
    .reels-container {
      height: calc(100vh - 56px);
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }
    .reel-item {
      height: calc(100vh - 56px);
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }
    /* Story Progress Bar */
    @keyframes storyProgress {
      from { width: 0%; }
      to { width: 100%; }
    }
    .story-progress-active {
      animation: storyProgress 5s linear forwards;
    }
    /* Slide-up Drawer */
    .drawer-transition {
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex justify-center">

  <!-- Mobile App Container -->
  <div id="app" class="w-full max-w-md bg-black min-h-screen relative pb-14 border-x border-neutral-900">

    <!-- ==================== HOME TAB ==================== -->
    <div id="tab-home" class="block">

          Mini Instagram

        <div class="flex items-center space-x-4">
          <button onclick="showToast('Notifications: You are all caught up!')" class="text-white hover:opacity-75 transition" aria-label="Notifications">

              <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
            </svg>
          </button>
          <button onclick="showToast('Direct Messages coming soon!')" class="text-white hover:opacity-75 transition" aria-label="Messages">

              <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Stories Bar -->
      <section class="border-b border-neutral-900 py-3 px-3">
        <div id="stories-bar" class="flex space-x-4 overflow-x-auto no-scrollbar">
          <!-- Stories injected by JS -->
        </div>
      </section>

      <!-- Home Feed -->
      <main id="feed-container" class="divide-y divide-neutral-900">
        <!-- Posts injected by JS -->
      </main>
    </div>

    <!-- ==================== REELS TAB ==================== -->
    <div id="tab-reels" class="hidden bg-black">
      <div id="reels-container" class="reels-container no-scrollbar relative">
        <!-- Reels injected by JS -->

    <!-- ==================== STORY VIEWER MODAL ==================== -->

      </div>
      <!-- Story Header -->

        <div class="flex items-center space-x-2.5">
          <img id="story-viewer-avatar" src="" alt="" class="w-8 h-8 rounded-full object-cover border border-white" />

          <label class="block w-full aspect-square bg-neutral-900 border-2 border-dashed border-neutral-700 rounded-xl flex flex-col items-center justify-center cursor-pointer overflow-hidden hover:border-pink-500 transition">
            <img id="upload-preview" src="" alt="" class="hidden w-full h-full object-cover" />
            <div id="upload-placeholder" class="text-center p-4">
              <svg class="w-10 h-10 text-neutral-500 mx-auto mb-2" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              <span class="text-sm text-neutral-400">Tap to select photo from gallery</span>
            </div>
            <input id="upload-file-input" type="file" accept="image/*" class="hidden" onchange="previewUploadImage(event)" required />
          </label>

          <textarea id="upload-caption" rows="2" placeholder="Write a caption..." class="w-full bg-neutral-900 text-white text-sm rounded-xl p-3 border border-neutral-800 focus:outline-none focus:border-pink-500"></textarea>

          <button type="submit" class="w-full ig-gradient-btn text-white font-semibold py-2.5 rounded-xl shadow-lg hover:opacity-90 transition">
            Share Post
          </button>
        </form>
      </div>
    </div>

    <!-- ==================== EDIT PROFILE MODAL ==================== -->
    <div id="edit-profile-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
      <div class="bg-[#121212] border border-neutral-800 rounded-2xl w-full max-w-sm p-5">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold">Edit Profile</h2>
          <button onclick="closeEditProfileModal()" class="text-neutral-400 hover:text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <form onsubmit="handleSaveProfile(event)" class="space-y-4">
          <div>
            <label class="text-xs text-neutral-400 block mb-1">Name</label>
            <input id="edit-name-input" type="text" class="w-full bg-neutral-900 text-white text-sm rounded-xl p-3 border border-neutral-800 focus:outline-none focus:border-pink-500" required />
          </div>
          <div>
            <label class="text-xs text-neutral-400 block mb-1">Bio</label>
            <textarea id="edit-bio-input" rows="3" class="w-full bg-neutral-900 text-white text-sm rounded-xl p-3 border border-neutral-800 focus:outline-none focus:border-pink-500"></textarea>
          </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl transition">
            Save Changes
          </button>
        </form>
      </div>
    </div>

    <!-- ==================== TOAST NOTIFICATION ==================== -->
    <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 bg-neutral-800 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-xl z-50 hidden transition-opacity duration-300 border border-neutral-700">
    </div>

  </div>
